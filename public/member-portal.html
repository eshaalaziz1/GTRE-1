<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; padding: 20px; }
  h1 { color: #003057; text-align: center; margin-bottom: 4px; font-size: 28px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }

  /* Stats */
  .stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: #003057; }
  .stat-label { font-size: 12px; color: #888; }

  /* Week Selector */
  .week-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; max-width: 800px; margin: 0 auto 20px; }
  .week-pill { min-width: 90px; padding: 10px 16px; border-radius: 10px; border: 2px solid #e0e0e0; background: #fff; text-align: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  .week-pill:hover { border-color: #B3A369; }
  .week-pill.active { border-color: #003057; background: #003057; }
  .week-pill.active .week-num { color: #fff; }
  .week-pill.active .week-date { color: #B3A369; }
  .week-pill .week-num { font-size: 14px; font-weight: 700; color: #003057; }
  .week-pill .week-date { font-size: 11px; color: #888; margin-top: 2px; }
  .week-pill.completed { border-color: #2e7d32; }
  .week-pill.completed .week-num::after { content: ' \\2713'; color: #2e7d32; font-size: 12px; }
  .week-pill.active.completed .week-num::after { color: #B3A369; }

  /* Content Area */
  .content { max-width: 800px; margin: 0 auto; }
  .section-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  /* Event Card */
  .event-card { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; border-left: 4px solid #B3A369; }
  .event-card.past { opacity: 0.6; border-left-color: #ccc; }
  .event-info { flex: 1; }
  .event-name { font-size: 18px; font-weight: 700; color: #003057; margin-bottom: 4px; }
  .event-meta { font-size: 13px; color: #888; }
  .event-meta span { margin-right: 16px; }
  .event-location { color: #B3A369; font-weight: 600; }
  .checkin-btn { background: #003057; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
  .checkin-btn:hover { background: #B3A369; }
  .checkin-btn:disabled { background: #ccc; cursor: not-allowed; }
  .checked-badge { background: #e8f5e9; color: #2e7d32; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* Assignment Cards */
  .assignment-card { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #003057; }
  .assignment-card.submitted { border-left-color: #2e7d32; }
  .assignment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .assignment-title { font-size: 16px; font-weight: 700; color: #003057; }
  .assignment-due { font-size: 12px; color: #e53935; font-weight: 600; }
  .assignment-due.past { color: #999; }
  .assignment-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 14px; }
  .assignment-status { display: flex; align-items: center; gap: 12px; }
  .submit-btn { background: #003057; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .submit-btn:hover { background: #B3A369; }
  .submitted-badge { background: #e8f5e9; color: #2e7d32; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .no-assignments { text-align: center; padding: 32px; color: #bbb; font-size: 14px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

  /* Modals */
  .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
  .overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 36px; max-width: 480px; width: 90%; position: relative; }
  .close-x { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 22px; cursor: pointer; color: #999; }
  .modal h2 { color: #003057; font-size: 22px; margin-bottom: 4px; text-align: center; }
  .modal .modal-sub { color: #B3A369; font-weight: 600; font-size: 15px; margin-bottom: 24px; text-align: center; }
  .modal label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; margin-top: 14px; }
  .modal input, .modal textarea, .modal select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: #B3A369; }
  .modal textarea { resize: vertical; min-height: 80px; }
  .code-input { font-size: 24px !important; text-align: center; letter-spacing: 8px; font-weight: 700; color: #003057; text-transform: uppercase; }
  .code-input.error { border-color: #e53935; animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .error-msg { color: #e53935; font-size: 13px; margin-top: 8px; min-height: 20px; text-align: center; }
  .modal .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  .modal .cancel-btn { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; color: #666; }
  .modal .cancel-btn:hover { background: #f5f5f5; }
  .modal .submit-btn-modal { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #003057; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; }
  .modal .submit-btn-modal:hover { background: #B3A369; }

  /* File upload area */
  .file-drop { border: 2px dashed #ddd; border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
  .file-drop:hover { border-color: #B3A369; background: #fefcf5; }
  .file-drop.has-file { border-color: #2e7d32; background: #f0faf0; }
  .file-drop-icon { font-size: 28px; margin-bottom: 8px; }
  .file-drop-text { font-size: 13px; color: #888; }
  .file-drop-text strong { color: #003057; }
  .file-name { font-size: 13px; color: #2e7d32; font-weight: 600; margin-top: 6px; }
  .att-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f0faf0; border-radius: 8px; margin-bottom: 6px; }
  .att-item-name { font-size: 13px; color: #333; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .att-item-size { font-size: 11px; color: #888; margin: 0 12px; white-space: nowrap; }
  .att-remove { background: none; border: none; color: #e53935; font-size: 16px; cursor: pointer; padding: 0 4px; font-weight: 700; }

  /* Success */
  .success-view { display: none; text-align: center; padding: 20px 0; }
  .success-view .checkmark { width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; color: #2e7d32; }
  .success-view h3 { color: #003057; margin-bottom: 8px; font-size: 20px; }
  .success-view p { color: #666; font-size: 14px; }
</style>
</head>
<body>

<div style="margin-bottom:16px;"><a href="javascript:void(0)" onclick="window.top.location.href='https://www.reatgt.org/'" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #ddd;padding:8px 16px;border-radius:8px;font-size:13px;color:#003057;text-decoration:none;font-weight:600;">&larr; Back to Website</a></div>

<h1>Member Portal</h1>
<p class="subtitle">Check in to events and submit assignments each week</p>

<div class="stats">
  <div class="stat">
    <div class="stat-num" id="attended-count">0</div>
    <div class="stat-label">Events Attended</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="assignments-done">0</div>
    <div class="stat-label">Assignments Done</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="total-count">13</div>
    <div class="stat-label">Total Weeks</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="rate">0%</div>
    <div class="stat-label">Completion Rate</div>
  </div>
</div>

<div class="week-scroll" id="week-scroll"></div>
<div class="content" id="content"></div>

<!-- Check-In Modal -->
<div class="overlay" id="checkin-overlay">
  <div class="modal">
    <button class="close-x" onclick="closeCheckin()">&times;</button>
    <div id="checkin-form">
      <h2>Check In</h2>
      <p class="modal-sub" id="checkin-event-name"></p>
      <label>Enter the session code</label>
      <input type="text" class="code-input" id="code-input" maxlength="6" placeholder="------" autocomplete="off" />
      <div class="error-msg" id="checkin-error"></div>
      <div class="btn-row">
        <button class="cancel-btn" onclick="closeCheckin()">Cancel</button>
        <button class="submit-btn-modal" onclick="submitCheckIn()">Check In</button>
      </div>
    </div>
    <div class="success-view" id="checkin-success">
      <div class="checkmark">&#10003;</div>
      <h3>You're Checked In!</h3>
      <p id="checkin-success-msg"></p>
    </div>
  </div>
</div>

<!-- Assignment Submit Modal -->
<div class="overlay" id="assign-overlay">
  <div class="modal">
    <button class="close-x" onclick="closeAssign()">&times;</button>
    <div id="assign-form">
      <h2>Submit Assignment</h2>
      <p class="modal-sub" id="assign-title"></p>

      <label>Submission Type</label>
      <select id="assign-type" onchange="toggleSubmitType()">
        <option value="link">Link (Google Docs, Drive, etc.)</option>
        <option value="text">Text Response</option>
        <option value="file">File Upload</option>
      </select>

      <div id="link-field">
        <label>Link URL</label>
        <input type="url" id="assign-link" placeholder="https://docs.google.com/..." />
      </div>

      <div id="text-field" style="display:none;">
        <label>Your Response</label>
        <textarea id="assign-text" placeholder="Type your response here..."></textarea>
      </div>

      <div id="file-field" style="display:none;">
        <label>Upload File</label>
        <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
          <div class="file-drop-icon">&#128206;</div>
          <div class="file-drop-text"><strong>Click to upload</strong> or drag and drop</div>
          <div class="file-name" id="file-name"></div>
        </div>
        <input type="file" id="file-input" style="display:none;" onchange="handleFile(this)" />
      </div>

      <label>Comments (optional)</label>
      <textarea id="assign-comments" placeholder="Any notes for the reviewer..." style="min-height:50px;"></textarea>

      <div class="error-msg" id="assign-error"></div>
      <div class="btn-row">
        <button class="cancel-btn" onclick="closeAssign()">Cancel</button>
        <button class="submit-btn-modal" onclick="submitAssignment()">Submit</button>
      </div>
    </div>
    <div class="success-view" id="assign-success">
      <div class="checkmark">&#10003;</div>
      <h3>Submitted!</h3>
      <p id="assign-success-msg"></p>
    </div>
  </div>
</div>

<script>
var weeks = [
  {
    id: 1, label: "Week 1", date: "Jan 29",
    event: { name: "Spring Kickoff Event", date: "2026-01-29", time: "6:00 PM", location: "Star Metals Offices" },
    assignments: []
  },
  {
    id: 2, label: "Week 2", date: "Feb 3",
    event: { name: "Careers in CRE Finance", date: "2026-02-03", time: "6:30 PM", location: "Scheller" },
    assignments: [
      { id: "a1", title: "CRE Finance Reflection", desc: "Write a 1-page reflection on the careers in CRE finance panel. What role interests you most and why?", due: "2026-02-10" }
    ]
  },
  {
    id: 3, label: "Week 3", date: "Feb 5",
    event: { name: "Private Equity Panel", date: "2026-02-05", time: "5:00 PM", location: "Caddell" },
    assignments: [
      { id: "a2", title: "PE Case Study Analysis", desc: "Analyze the provided PE deal case study. Submit your financial model and 1-page memo.", due: "2026-02-12" }
    ]
  },
  {
    id: 4, label: "Week 4", date: "Feb 12",
    event: { name: "Affordable Housing Panel", date: "2026-02-12", time: "5:00 PM", location: "Caddell" },
    assignments: []
  },
  {
    id: 5, label: "Week 5", date: "Feb 19",
    event: { name: "Industrial Real Estate Panel", date: "2026-02-19", time: "5:00 PM", location: "Caddell" },
    assignments: [
      { id: "a3", title: "Industrial Market Report", desc: "Research and submit a 2-page market report on an industrial submarket of your choice.", due: "2026-02-26" }
    ]
  },
  {
    id: 6, label: "Week 6", date: "Feb 23",
    event: { name: "RangeWater Recruiting Presentation", date: "2026-02-23", time: "5:30 PM", location: "Caddell" },
    assignments: []
  },
  {
    id: 7, label: "Week 7", date: "Feb 26",
    event: { name: "Tech and AI in CRE", date: "2026-02-26", time: "5:00 PM", location: "Caddell" },
    assignments: [
      { id: "a4", title: "PropTech Analysis", desc: "Identify a PropTech company and present how it disrupts traditional real estate. Submit a slide deck (5-8 slides).", due: "2026-03-05" }
    ]
  },
  {
    id: 8, label: "Week 8", date: "Mar 5",
    event: { name: "Real Estate Capital Markets Panel", date: "2026-03-05", time: "5:00 PM", location: "Caddell" },
    assignments: []
  },
  {
    id: 9, label: "Week 9", date: "Mar 9",
    event: { name: "Hospitality Panel", date: "2026-03-09", time: "6:30 PM", location: "Caddell" },
    assignments: [
      { id: "a5", title: "Hotel Underwriting Exercise", desc: "Complete the hotel underwriting template provided. Submit your completed Excel model.", due: "2026-03-16" }
    ]
  },
  {
    id: 10, label: "Week 10", date: "Mar 12",
    event: { name: "Joint Real Estate Conference", date: "2026-03-12", time: "1:00 PM", location: "The Foundry" },
    assignments: []
  },
  {
    id: 11, label: "Week 11", date: "Apr 2",
    event: { name: "Development Panel", date: "2026-04-02", time: "5:00 PM", location: "Caddell" },
    assignments: [
      { id: "a6", title: "Development Pro Forma", desc: "Build a basic development pro forma for a hypothetical multifamily project. Use the provided template.", due: "2026-04-09" }
    ]
  },
  {
    id: 12, label: "Week 12", date: "Apr 9",
    event: { name: "Acquisitions Panel", date: "2026-04-09", time: "5:00 PM", location: "Caddell" },
    assignments: []
  },
  {
    id: 13, label: "Week 13", date: "Apr 16",
    event: { name: "Entrepreneurship & Personal RE Investing", date: "2026-04-16", time: "5:00 PM", location: "Caddell" },
    assignments: [
      { id: "a7", title: "Personal Investment Thesis", desc: "Write a 2-page personal real estate investment thesis. What asset class, market, and strategy would you pursue?", due: "2026-04-23" }
    ]
  }
];

var today = new Date().toISOString().split('T')[0];
var checkedIn = JSON.parse(localStorage.getItem('gt-checkins2') || '[]');
var submitted = JSON.parse(localStorage.getItem('gt-assignments') || '[]');
var activeWeek = null;
var currentEvent = null;
var currentAssignment = null;

function isPast(d) { return d < today; }

function findCurrentWeek() {
  for (var i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i].event.date <= today) return weeks[i].id;
  }
  return 1;
}

function updateStats() {
  document.getElementById('attended-count').textContent = checkedIn.length;
  document.getElementById('assignments-done').textContent = submitted.length;
  var totalAssignments = 0;
  weeks.forEach(function(w) { totalAssignments += w.assignments.length; });
  var total = weeks.length + totalAssignments;
  var done = checkedIn.length + submitted.length;
  var rate = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('rate').textContent = rate + '%';
}

function isWeekComplete(w) {
  var eventDone = checkedIn.includes(String(w.id));
  var allAssignments = w.assignments.every(function(a) { return submitted.includes(a.id); });
  return eventDone && allAssignments;
}

function renderWeekPills() {
  var html = '';
  weeks.forEach(function(w) {
    var complete = isWeekComplete(w);
    var isActive = w.id === activeWeek;
    html += '<div class="week-pill' + (isActive ? ' active' : '') + (complete ? ' completed' : '') + '" onclick="selectWeek(' + w.id + ')">' +
      '<div class="week-num">' + w.label + '</div>' +
      '<div class="week-date">' + w.date + '</div>' +
    '</div>';
  });
  document.getElementById('week-scroll').innerHTML = html;
}

function selectWeek(id) {
  activeWeek = id;
  renderWeekPills();
  renderContent();
}

function renderContent() {
  var w = weeks.find(function(x) { return x.id === activeWeek; });
  if (!w) return;
  var e = w.event;
  var past = isPast(e.date);
  var done = checkedIn.includes(String(w.id));
  var dateObj = new Date(e.date + 'T12:00:00');
  var dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  var html = '<div class="section-title">Event</div>';
  html += '<div class="event-card' + (past && !done ? ' past' : '') + '">' +
    '<div class="event-info">' +
      '<div class="event-name">' + e.name + '</div>' +
      '<div class="event-meta">' +
        '<span>' + dateStr + ' &bull; ' + e.time + '</span>' +
        '<span class="event-location">' + e.location + '</span>' +
      '</div>' +
    '</div>' +
    (done
      ? '<div class="checked-badge">&#10003; Checked In</div>'
      : past
        ? '<button class="checkin-btn" disabled>Closed</button>'
        : '<button class="checkin-btn" onclick="openCheckin(' + w.id + ')">Check In</button>'
    ) +
  '</div>';

  html += '<div class="section-title" style="margin-top:24px;">Assignments</div>';

  if (w.assignments.length === 0) {
    html += '<div class="no-assignments">No assignments this week</div>';
  } else {
    w.assignments.forEach(function(a) {
      var aDone = submitted.includes(a.id);
      var aPast = isPast(a.due);
      var dueDate = new Date(a.due + 'T12:00:00');
      var dueStr = dueDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      html += '<div class="assignment-card' + (aDone ? ' submitted' : '') + '">' +
        '<div class="assignment-header">' +
          '<div class="assignment-title">' + a.title + '</div>' +
          '<div class="assignment-due' + (aPast ? ' past' : '') + '">Due ' + dueStr + '</div>' +
        '</div>' +
        '<div class="assignment-desc">' + a.desc + '</div>' +
        '<div class="assignment-status">' +
          (aDone
            ? '<div class="submitted-badge">&#10003; Submitted</div>'
            : '<button class="submit-btn" onclick="openAssign(\'' + a.id + '\')">Submit Assignment</button>'
          ) +
        '</div>' +
      '</div>';
    });
  }

  document.getElementById('content').innerHTML = html;
}

// Check-In Modal
function openCheckin(weekId) {
  var w = weeks.find(function(x) { return x.id === weekId; });
  currentEvent = { weekId: weekId, name: w.event.name };
  document.getElementById('checkin-event-name').textContent = w.event.name;
  document.getElementById('code-input').value = '';
  document.getElementById('code-input').classList.remove('error');
  document.getElementById('checkin-error').textContent = '';
  document.getElementById('checkin-form').style.display = 'block';
  document.getElementById('checkin-success').style.display = 'none';
  document.getElementById('checkin-overlay').classList.add('active');
  setTimeout(function() { document.getElementById('code-input').focus(); }, 100);
}

function closeCheckin() {
  document.getElementById('checkin-overlay').classList.remove('active');
  currentEvent = null;
}

function submitCheckIn() {
  var code = document.getElementById('code-input').value.trim().toUpperCase();
  if (!code || code.length < 4) {
    document.getElementById('code-input').classList.add('error');
    document.getElementById('checkin-error').textContent = 'Please enter the session code.';
    return;
  }

  checkedIn.push(String(currentEvent.weekId));
  localStorage.setItem('gt-checkins2', JSON.stringify(checkedIn));

  document.getElementById('checkin-form').style.display = 'none';
  document.getElementById('checkin-success').style.display = 'block';
  document.getElementById('checkin-success-msg').textContent = 'You are checked in for ' + currentEvent.name;

  updateStats();
  renderWeekPills();
  renderContent();
  setTimeout(closeCheckin, 2000);
}

// Assignment Modal
function openAssign(assignId) {
  var a = null;
  weeks.forEach(function(w) {
    w.assignments.forEach(function(x) { if (x.id === assignId) a = x; });
  });
  currentAssignment = a;
  document.getElementById('assign-title').textContent = a.title;
  document.getElementById('assign-link').value = '';
  document.getElementById('assign-text').value = '';
  document.getElementById('assign-comments').value = '';
  document.getElementById('file-name').textContent = '';
  document.getElementById('file-drop').classList.remove('has-file');
  document.getElementById('assign-error').textContent = '';
  document.getElementById('assign-type').value = 'link';
  toggleSubmitType();
  document.getElementById('assign-form').style.display = 'block';
  document.getElementById('assign-success').style.display = 'none';
  document.getElementById('assign-overlay').classList.add('active');
}

function closeAssign() {
  document.getElementById('assign-overlay').classList.remove('active');
  currentAssignment = null;
}

function toggleSubmitType() {
  var type = document.getElementById('assign-type').value;
  document.getElementById('link-field').style.display = type === 'link' ? 'block' : 'none';
  document.getElementById('text-field').style.display = type === 'text' ? 'block' : 'none';
  document.getElementById('file-field').style.display = type === 'file' ? 'block' : 'none';
}

function handleFile(input) {
  if (input.files.length > 0) {
    document.getElementById('file-name').textContent = input.files[0].name;
    document.getElementById('file-drop').classList.add('has-file');
  }
}

function submitAssignment() {
  var type = document.getElementById('assign-type').value;
  if (type === 'link' && !document.getElementById('assign-link').value.trim()) {
    document.getElementById('assign-error').textContent = 'Please paste a link to your submission.';
    return;
  }
  if (type === 'text' && !document.getElementById('assign-text').value.trim()) {
    document.getElementById('assign-error').textContent = 'Please enter your response.';
    return;
  }
  if (type === 'file' && !document.getElementById('file-input').files.length) {
    document.getElementById('assign-error').textContent = 'Please select a file to upload.';
    return;
  }

  submitted.push(currentAssignment.id);
  localStorage.setItem('gt-assignments', JSON.stringify(submitted));

  document.getElementById('assign-form').style.display = 'none';
  document.getElementById('assign-success').style.display = 'block';
  document.getElementById('assign-success-msg').textContent = currentAssignment.title + ' submitted successfully.';

  updateStats();
  renderWeekPills();
  renderContent();
  setTimeout(closeAssign, 2000);
}

// Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('checkin-overlay').classList.contains('active')) {
    submitCheckIn();
  }
});

// Init
activeWeek = findCurrentWeek();
updateStats();
renderWeekPills();
renderContent();
</script>
</body>
</html>
